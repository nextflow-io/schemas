site_name: Nextflow Schemas
site_description: JSON schemas for Nextflow pipeline inputs and plugins
site_url: https://github.com/nextflow-io/schemas
repo_url: https://github.com/nextflow-io/schemas
repo_name: nextflow-io/schemas

theme:
  name: material
  icon:
    logo: octicons/codescan-checkmark-16
  font:
    text: Inter
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - social
  - info
  - offline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - Schemas:
      - Pipeline Input Schema: schemas/pipeline-input.md
      - Plugin Schema: schemas/plugin.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - CI/CD: development/ci-cd.md
  - Examples:
      - Pipeline Input Examples: examples/pipeline-input-examples.md
      - Plugin Examples: examples/plugin-examples.md
