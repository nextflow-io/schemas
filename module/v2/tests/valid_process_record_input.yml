$schema: https://raw.githubusercontent.com/nextflow-io/schemas/main/module/v2/schema.json
name: nf-core/example
version: 1.0.0
description: Example module
license: MIT
input:
  - type: Record
    description: Sample with reads and optional index
    fields:
      - name: id
        type: String
        description: Sample identifier
      - name: bam
        type: Path
        description: Aligned reads
        pattern: "*.bam"
      - name: bai
        type: Path?
        description: BAM index, if available
