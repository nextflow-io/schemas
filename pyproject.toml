[project]
name = "nextflow-schemas"
version = "0.1.0"
description = "JSON schemas for Nextflow pipeline inputs and plugins"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material[imaging]>=9.5.0",
    "pymdown-extensions>=10.0",
    "pre-commit>=4.3.0"
]

[dependency-groups]
dev = [
    "check-jsonschema>=0.27.0",
    "pre-commit>=4.3.0"
]
